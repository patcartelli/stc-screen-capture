# electron-builder.yml — STC-401. Dev-machine packaging only: this produces
# a signed .app for local use, keeping TCC grants alive across rebuilds the
# same way helper/build.sh already does for the Swift helper. No
# zip, no auto-update — see the design spec. `identity` below is the DEV one;
# `npm run release:dmg` overrides it with Developer ID and notarizes (STC-508b).
# STC-508a adds the `dmg` target. `npm run app:package` still passes
# `--mac dir` (fast, local); `npm run release:dmg` passes `--mac dmg`.
appId: com.studiocartelli.capture
productName: Capture
# STC-657: fuses off for what a packaged Capture never uses. Each one lets a
# process that launches the app run its own code under Capture's grants:
# ELECTRON_RUN_AS_NODE turns the app binary into a Node, NODE_OPTIONS preloads
# a script, --inspect opens a debugger on the main process. electron-builder
# flips them after packaging and before signing, so the signature covers them.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
directories:
  output: release
files:
  - app/dist/**/*
  - app/renderer/**/*
  - package.json
extraResources:
  - from: helper/build/stc-helper
    to: stc-helper
mac:
  target:
    - target: dir
    - target: dmg
  icon: build/Capture.icns
  identity: "STC Dev Signing"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  binaries:
    - Contents/Resources/stc-helper
  artifactName: "${productName}-${version}-${arch}.${ext}"
  extendInfo:
    NSCameraUsageDescription: "Capture records a camera picture-in-picture alongside the screen."
    NSMicrophoneUsageDescription: "Capture records a microphone track alongside the screen."
