<!doctype html>
<meta charset="utf-8">
<title>STC-627 test colors</title>
<style>
  body { margin: 0; font: 14px -apple-system, sans-serif; background: #fff; color: #111; }
  h1 { font-size: 16px; margin: 16px 20px 4px; }
  p { margin: 0 20px 12px; color: #555; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 20px 20px; }
  .card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .sw { height: 140px; }
  .t { padding: 8px 10px; line-height: 1.4; }
  .t b { font-family: ui-monospace, monospace; }
  .p3 .t { background: #fff8e6; }
</style>
<h1>Pick Color test colors</h1>
<p>Pick in the middle of a swatch. Expected is the sRGB hex the toast should show. Orange cards are Display P3 colors outside sRGB: the toast should say "clamped".</p>
<div class="grid" id="g"></div>
<script>
const sRGB = [
  ["Blue", "#3478f6"], ["Red", "#e5322d"], ["Green", "#2aa84a"], ["Yellow", "#f5c518"],
  ["Mid gray", "#808080"], ["Near white", "#f2f2f2"], ["Near black", "#1a1a1a"], ["Purple", "#8e44ad"],
];
const p3 = [
  ["P3 green", "color(display-p3 0 1 0)", "~#00ff00, clamped"],
  ["P3 red", "color(display-p3 1 0 0)", "~#ff0000, clamped"],
  ["P3 blue", "color(display-p3 0 0 1)", "~#0000ff, clamped"],
  ["P3 orange", "color(display-p3 1 0.5 0)", "near #ff8000, clamped"],
];
const g = document.getElementById("g");
const add = (name, css, exp, cls) => g.insertAdjacentHTML("beforeend",
  `<div class="card ${cls}"><div class="sw" style="background:${css}"></div><div class="t">${name}<br>Expected <b>${exp}</b></div></div>`);
sRGB.forEach(([n, h]) => add(n, h, h, ""));
p3.forEach(([n, c, e]) => add(n, c, e, "p3"));
</script>
