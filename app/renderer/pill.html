<!doctype html>
<html lang="en" data-surface="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Recording</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* ── the pill (STC-375; its own window since STC-550) ─────────────────
       Moved from the library's index.html as it was, with one change the
       window's move forced: the whole pill drags now (requirement 5), so Stop
       is its own button (`#pill-stop`, the square glyph that already said
       what a click does) instead of the whole pill being one. The drag is
       pill-renderer.ts's pointer events, not `-webkit-app-region: drag`: on
       hardware the native region moved this panel once and then never again.

       Dark always (#0b0b0c/#f5f5f5, pill.ts's PILL_THEME): it floats over
       someone else's window for the length of a take, where light chrome has
       nothing reliable to sit against.

       Requirement 10 (reduced motion): the pill appears and goes with no
       transition at all. The two things that do move both stop under reduced
       motion: the live dot's pulse (below), and the drag's easing, which
       places the pill directly instead (pill-window.ts's `onDrag`). */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b0b0c; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    #pill {
      box-sizing: border-box; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 0 10px;
      background: #0b0b0c; color: #f5f5f5; font: var(--type-readout-pill)/1 var(--font-readout);
      /* STC-447: the ring mirrors pill.ts's PILL_THEME.ring. No box-shadow:
         the pill fills an opaque window edge to edge, so the native window
         shadow is the shadow. */
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 16px;
      cursor: grab; touch-action: none;
    }
    #pill.dragging { cursor: grabbing; }
    /* Measured by pill-renderer.ts; main sizes the window to it plus
       PILL_CHROME_PX (the padding and ring above). */
    #pill-row { display: inline-flex; align-items: center; gap: 6px; width: max-content; }
    #pill-dot {
      width: 8px; height: 8px; border-radius: 50%; flex: none;
      background: #ff3b30; animation: pill-live-pulse 1.4s ease-in-out infinite;
    }
    @keyframes pill-live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { #pill-dot { animation: none; } }
    #pill-timer { flex: none; font-variant-numeric: tabular-nums; }
    /* The level meter (STC-528; pill.ts's meterView decides, this draws).
       Hatched until the helper has sent a reading: no mic, or one lost. A
       static diagonal stripe is the one pattern that cannot be mistaken for a
       moving bar, so a level is never implied where none was measured.
       .live: the bar's width is --level (0..1, dB-scaled), the colors are
       PILL_THEME's meterLevel/meterTrack. .no-signal: the helper says 10 s of
       silence, so the bar flattens to a baseline with an amber dot at its end
       (Patrick, 2026-10-15). Warn only; it clears when signal returns. The
       width never changes between modes, so a mode change cannot resize the
       window. */
    #pill-meter {
      position: relative; width: 18px; height: 8px; border-radius: 2px; flex: none;
      background: repeating-linear-gradient(45deg, #3a3a3c 0 2px, transparent 2px 4px);
    }
    #pill-meter-bar, #pill-meter-dot { display: none; position: absolute; }
    #pill-meter.live { background: #2c2c2e; }
    #pill-meter.live #pill-meter-bar {
      display: block; left: 0; top: 0; bottom: 0; border-radius: 2px;
      width: calc(var(--level, 0) * 100%); background: #f5f5f5;
      transition: width 60ms linear;
    }
    #pill-meter.no-signal { background: linear-gradient(#636366, #636366) left 50% / 13px 1px no-repeat; }
    #pill-meter.no-signal #pill-meter-dot {
      display: block; right: 0; top: 2px; width: 4px; height: 4px; border-radius: 50%;
      background: #ff9f0a;
    }
    /* Stop: the universal stop glyph (QuickTime/Zoom/OBS). Its own button
       now, the one place a press does not start a drag, with the hover fill
       (PILL_THEME's .hover) that used to sit on the whole pill. */
    #pill-stop {
      display: grid; place-items: center; flex: none;
      width: 20px; height: 20px; margin: 0 -4px 0 0; padding: 0;
      border: 0; border-radius: 4px; background: transparent; cursor: pointer;
    }
    #pill-stop:hover:not([disabled]) { background: var(--surface-deep-hover); }
    #pill-stop:active:not([disabled]) { background: var(--overlay-fill); }
    #pill-stop:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    #pill-stop-glyph { width: 8px; height: 8px; border-radius: 2px; background: #f5f5f5; }
    /* STC-531: the helper stopped the take by itself, and for PILL_STOPPED_DWELL_MS
       the pill says why ("Window closed") instead of the timer. The label
       replaces everything else, in the system font, which is narrower than the
       pixel font at this size; one that still does not fit is cut with an
       ellipsis rather than clipped mid-letter. */
    #pill-label { display: none; }
    #pill.stopped #pill-row > :not(#pill-label) { display: none; }
    /* STC-237: a mic or camera lost while the take KEEPS recording. The label
       stands in for the timer and meter only: the dot still says recording,
       and Stop stays, because this take is still running. */
    #pill.notice #pill-timer, #pill.notice #pill-meter { display: none; }
    #pill.stopped #pill-label, #pill.notice #pill-label {
      display: block; flex: 1 1 auto; min-width: 0; text-align: center;
      font: 500 11px/1 -apple-system, system-ui, sans-serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="pill" role="group" aria-label="Recording">
    <span id="pill-row">
      <span id="pill-dot" aria-hidden="true"></span>
      <span id="pill-timer">00:00</span>
      <span id="pill-meter" aria-hidden="true"><span id="pill-meter-bar"></span><span id="pill-meter-dot"></span></span>
      <button id="pill-stop" aria-label="Stop recording"><span id="pill-stop-glyph" aria-hidden="true"></span></button>
      <span id="pill-label"></span>
    </span>
  </div>
  <script src="../dist/pill-renderer.js"></script>
</body>
</html>
