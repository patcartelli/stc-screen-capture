<!doctype html>
<html lang="en" data-surface="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'">
<title>stc selection</title>
<!-- Fonts and the dropdown component (STC-456). Linked BEFORE the <style>
     below, whose html/body rule has to win: tokens.css gives :root a font and
     color-scheme, and this window must stay a transparent surface. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="device-menu.css">
<style>
  /* The window is transparent; everything visible here is drawn deliberately.
     No scrollbars, no selection, no drag-image — the overlay is a surface to
     draw ON, not a document. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
    user-select: none; -webkit-user-select: none; cursor: crosshair;
    font: var(--type-body-weight) var(--type-body)/var(--type-body-lh) var(--font-sans);
  }
  /* Window mode points with a camera (STC-625), as macOS's own window shot
     does: the pointer says a click takes a picture of what it is over. The
     hotspot is the lens centre. */
  body.window-mode { cursor: url(cursor-camera.svg) 16 18, default; }

  /* The dim, and the hole in it.

     One element with an enormous spread shadow, rather than four rectangles
     around the selection: the shadow follows the element on every frame with
     no chance of a one-pixel seam appearing between panels as the marquee
     moves, and there is exactly one thing to keep in sync with the state. */
  #marquee {
    position: absolute; box-sizing: border-box;
    box-shadow: 0 0 0 100000px var(--scrim);
    border: 1px solid var(--text);
    display: none;
  }
  /* Only Expand adds this class. Drawing and resizing a marquee must stay
     under the pointer, rather than easing after it. */
  #marquee.expand-transition {
    transition: left var(--dur-move) ease-out, top var(--dur-move) ease-out,
                width var(--dur-move) ease-out, height var(--dur-move) ease-out;
  }
  /* Before the first drag the whole display is dimmed, with no hole at all. */
  #scrim {
    position: absolute; inset: 0;
    background: var(--scrim);
  }
  body.has-selection #scrim, body.window-mode #scrim { display: none; }
  body.window-mode #marquee { display: none; }

  /* Resize handles. Eight of them, drawn as small white squares with a dark
     hairline so they read against both a bright and a dark backdrop. */
  .handle {
    position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px;
    background: var(--text); border: 1px solid var(--handle-edge); border-radius: var(--radius-xs);
    box-shadow: var(--shadow-chip);
  }
  .handle.nw { cursor: nwse-resize } .handle.se { cursor: nwse-resize }
  .handle.ne { cursor: nesw-resize } .handle.sw { cursor: nesw-resize }
  .handle.n  { cursor: ns-resize }   .handle.s  { cursor: ns-resize }
  .handle.w  { cursor: ew-resize }   .handle.e  { cursor: ew-resize }

  /* The window-mode highlight (STC-625): a tint over the part of the window
     that can be SEEN, one `.tint` per visible rect, and nothing over whatever
     covers the rest. No border: the pieces of one region meet edge to edge,
     and an outline on each would draw seams inside the window. Never
     animated, so reduced motion needs nothing here. */
  #highlight {
    position: absolute; left: 0; top: 0; display: none;
    pointer-events: none;
  }
  /* Mixed from --accent rather than --accent-soft (a fixed rgba): the tint is
     now the highlight's ONLY mark, so it must follow the accent token. At 18%
     it is --accent-soft's own dark value. */
  #highlight .tint {
    position: absolute;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
  }

  /* Readouts. Positioned by script; styled to stay legible over anything. */
  .chip {
    position: absolute; display: none;
    padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm);
    background: var(--chip-bg); color: var(--text);
    font-variant-numeric: tabular-nums;
    box-shadow: var(--shadow-chip);
    white-space: nowrap; pointer-events: none;
  }
  #size { font-weight: var(--type-body-strong-weight); }
  #title { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }

  /* The legend (STC-598). The overlay has no chrome, so the keys have to be
     stated. Same surface as the options bar above it: --surface-deep, which is
     opaque, so reduced transparency needs nothing here; and it never animates,
     so reduced motion needs nothing either. Keys are keycaps in the readout
     face; the words stay in Geist. Items are separated by a hairline, as the
     bar separates Expand. */
  #legend {
    position: absolute; left: 50%; transform: translateX(-50%);
    box-sizing: border-box; align-items: center; gap: var(--space-5);
    padding: 0 var(--space-6); height: 36px; border-radius: var(--radius-card);
    background: var(--surface-deep); color: var(--text-dim);
    box-shadow: var(--shadow-pop);
    font: 400 var(--type-meta)/1 var(--font-sans);
    pointer-events: none; white-space: nowrap;
  }
  #legend .item { display: flex; align-items: center; gap: var(--space-3); }
  #legend .item + .item { position: relative; }
  #legend .item + .item::before {
    content: ""; position: absolute; left: calc(var(--space-5) / -2); top: -6px; bottom: -6px;
    width: 1px; background: var(--border);
  }
  #legend kbd {
    font: 400 var(--type-value-sm)/1 var(--font-readout); font-variant-numeric: tabular-nums;
    color: var(--text); padding: 4px 6px; border-radius: var(--radius-xs);
    background: var(--overlay-fill);
  }

  /* The Record options bar (STC-456; Patrick's Figma, Capture SK 016 Frame 9).
     Dark in BOTH OS appearances (data-surface="dark"): --surface-deep on --text. Geist for
     everything but the size field, which is the readout face (JetBrains Mono). Every rect is
     decided by record-options.ts and placed by overlay.ts; this only paints.
     #pane is a background with no children, so every control is a sibling
     positioned in the same window-local space. */
  :root { --menu-surface: var(--surface-deep); --menu-on-surface: var(--text); }
  #bar { position: fixed; pointer-events: none; }
  #pane, #ctl-record {
    position: fixed; box-sizing: border-box; border-radius: var(--radius-card);
    background: var(--surface-deep); color: var(--text); pointer-events: auto; cursor: default;
    box-shadow: var(--shadow-pop);
    font: 400 13px/1 var(--font-sans);
  }
  .ctl { position: fixed; box-sizing: border-box; display: flex; align-items: center;
         justify-content: center; border-radius: var(--radius-md); color: var(--text-dim);
         pointer-events: auto; cursor: default;
         /* Buttons since STC-506 (Tab reaches them); this is the reset that
            keeps them looking like the divs they replaced. */
         appearance: none; border: 0; background: none; margin: 0; padding: 0; font: inherit; }
  .ctl:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .ctl:active { background: var(--overlay-fill); }
  .ctl[aria-disabled="true"]:active { background: none; }
  .ctl:hover { color: var(--text); background: var(--overlay-fill-faint); }
  .ctl[data-on="1"] { color: var(--text); }
  /* STC-583: a muted mic says so at a glance — a 2px record-colour outline and a
     tinted glyph. :not(:focus-visible) keeps the focus ring above on top of it. */
  #ctl-mic[data-on="0"]:not(:focus-visible) { color: var(--rec);
    outline: 2px solid color-mix(in srgb, var(--rec) 70%, transparent); outline-offset: -2px; }
  #ctl-clicks[data-on="0"] { opacity: .45; }   /* a toggle: off must read as off, not as hover-less */
  .ctl[data-enabled="0"] { opacity: .32; }
  .ctl[data-enabled="0"]:hover { background: none; color: var(--text-dim); }
  .ctl svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
  .ctl svg.caret { width: 16px; height: 16px; margin-left: 2px; }
  #ctl-size { justify-content: flex-start; gap: var(--space-3); padding: 0 var(--space-1); color: var(--text);
              font: 400 var(--type-readout-xl)/1 var(--font-readout); font-variant-numeric: tabular-nums; }
  #ctl-size:hover { background: none; }
  #ctl-size input { all: unset; field-sizing: content; min-width: 1ch; font: inherit;
                    color: inherit; caret-color: var(--text); cursor: text; }
  #ctl-size input:focus { box-shadow: 0 1px 0 var(--text-dim); }
  #ctl-size .x { opacity: .72; }
  #ctl-expand::before { content: ""; position: absolute; left: -9px; top: 6px; bottom: 6px;
                        width: 1px; background: var(--border); }
  #ctl-record { justify-content: flex-start; gap: var(--space-4); padding: 0 var(--space-6); color: var(--text);
                font: 500 14px/1 var(--font-sans); }
  #ctl-record:hover { background: var(--surface-deep-hover); }
  #ctl-record .label { flex: 1; }
  #ctl-record .kbd { display: flex; opacity: .56; }
  #menu { cursor: default; }
  /* STC-638: the camera menu's live view. 264 x 148 inside the menu's 8 px inset;
     camera-preview.ts's PREVIEW_* constants are these numbers (menuHeight counts them). */
  .campreview { position: relative; width: 264px; height: 148px; margin: 8px 8px 4px; border-radius: 10px;
                overflow: hidden; background: var(--surface-deep); }
  .campreview canvas { display: block; width: 264px; height: 148px; }
  .campreview .note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                      text-align: center; padding: 0 16px; color: var(--text-dim); font: 400 13px/1.3 var(--font-sans); }
  .campreview .note[hidden] { display: none; }
  #menu .row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  /* Reduced motion (STC-506): Expand's glide becomes a short fade of the
     marquee, not a jump. overlay.ts skips the geometry animation under this
     preference and adds .expand-fade instead. */
  #marquee.expand-fade { animation: expand-fade var(--dur-quick) ease-out; }
  @keyframes expand-fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div id="scrim"></div>
  <div id="marquee"></div>
  <div id="highlight"></div>
  <div id="size" class="chip"></div>
  <div id="title" class="chip"></div>
  <div id="legend"></div>
  <div id="bar" hidden>
    <div id="pane"></div>
    <div class="ctl" id="ctl-size"><input id="size-w" inputmode="numeric" aria-label="Width in pixels"><span class="x">×</span><input id="size-h" inputmode="numeric" aria-label="Height in pixels"></div>
    <button type="button" class="ctl" id="ctl-expand" aria-label="Whole display" title="Whole display"><span data-icon="expand"></span></button>
    <button type="button" class="ctl" id="ctl-crop" aria-label="Select an area" title="Select an area"><span data-icon="crop"></span></button>
    <button type="button" class="ctl" id="ctl-settings" aria-label="Settings" title="Settings"><span data-icon="settings"></span></button>
    <button type="button" class="ctl" id="ctl-mic" aria-label="Microphone"><span data-icon="mic"></span><span data-icon="caret" data-class="caret"></span></button>
    <button type="button" class="ctl" id="ctl-camera" aria-label="Camera"><span data-icon="camera"></span><span data-icon="caret" data-class="caret"></span></button>
    <button type="button" class="ctl" id="ctl-keys" role="switch" aria-label="Show keystrokes" title="Show keystrokes — commands and shortcuts only; typing is never recorded"><span data-icon="command"></span></button>
    <button type="button" class="ctl" id="ctl-clicks" role="switch" aria-label="Show clicks" title="Show clicks"><span data-icon="click"></span></button>
    <button type="button" class="ctl" id="ctl-record"><span data-icon="record"></span><span class="label">Capture Video</span><span class="kbd"><span data-icon="return"></span></span></button>
  </div>
  <div id="menu" class="device-menu" hidden role="menu"></div>
  <script src="../dist/overlay.js"></script>
</body>
</html>
