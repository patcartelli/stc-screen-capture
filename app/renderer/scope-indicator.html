<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>stc scope indicator</title>
  <style>
    /**
     * STC-381: a purely decorative outline around the current recording
     * scope's target. No script, no preload, no IPC — main.ts sets this
     * window's bounds directly to the target rect (global points, the same
     * space `BrowserWindow.setBounds` takes), and everything this page needs
     * to know is "draw a border at my own edge". `scope-indicator-window.ts`
     * makes the window click-through and non-capturable; nothing here does.
     */
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: transparent;
    }
    body {
      box-sizing: border-box;
      border: 3px solid #3b6fe0;
      border-radius: 4px;
    }
    @media (prefers-color-scheme: dark) {
      body { border-color: #7aa2ff; }
    }
  </style>
</head>
<body></body>
</html>
