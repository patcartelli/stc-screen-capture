<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>stc recorder</title>
  <style>
    /* ── instrument visual language (STC-372) ───────────────────────────────
       A restyle only: renderer.ts and library-view.ts reach the document
       exclusively through getElementById, so nothing below changes an id, a
       class a script branches on, or the <body> markup — only color, type
       and the token system that drives them. See STC-369 for the type ramp
       this ticket's surfaces don't yet draw from, and STC-374/375 for what
       the main window becomes next. */

    @font-face {
      font-family: 'Geist';
      src: url('fonts/Geist-Regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      src: url('fonts/Geist-Medium.woff2') format('woff2');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      src: url('fonts/Geist-SemiBold.woff2') format('woff2');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Geist Mono';
      src: url('fonts/GeistMono-Regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Geist Mono';
      src: url('fonts/GeistMono-Medium.woff2') format('woff2');
      font-weight: 500; font-style: normal; font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --font-sans: 'Geist', -apple-system, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Light tokens. There is no in-app theme switch — prefers-color-scheme
         below is the only signal, same as the color-scheme line already was. */
      --bg: #f6f6f4;
      --surface: #ffffff;
      --surface-hover: #eeeeeb;
      --border: rgba(15, 15, 12, .14);
      --border-strong: rgba(15, 15, 12, .30);
      --text: #171714;
      --text-dim: rgba(23, 23, 20, .62);
      --text-faint: rgba(23, 23, 20, .40);
      --accent: #3b6fe0;
      --accent-soft: rgba(59, 111, 224, .14);
      --rec: #d33a3a;
      --rec-soft: rgba(211, 58, 58, .12);
      --warn: #b9502c;
      --warn-soft: rgba(185, 80, 44, .12);
      --focus: #4f86ff;

      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131315;
        --surface: #1c1c1f;
        --surface-hover: #26262a;
        --border: rgba(255, 255, 255, .12);
        --border-strong: rgba(255, 255, 255, .26);
        --text: #f1f1ee;
        --text-dim: rgba(241, 241, 238, .64);
        --text-faint: rgba(241, 241, 238, .42);
        --accent: #7aa2ff;
        --accent-soft: rgba(122, 162, 255, .18);
        --rec: #ff6b6b;
        --rec-soft: rgba(255, 107, 107, .16);
        --warn: #e0925a;
        --warn-soft: rgba(224, 146, 90, .16);
        --focus: #7aa2ff;
      }
    }

    body { margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px;
           background: var(--bg); color: var(--text); }
    h1 { font-size: 15px; font-weight: 600; margin: 0; }
    /* 500 is a deliberate middle weight — body text is 400, headings are
       600, and a control (this rule, and .shortcut .keys below) reads as a
       control rather than as either. */
    button { font: inherit; font-weight: 500; padding: 8px 18px; border-radius: 7px;
              border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; }
    button:hover:not([disabled]) { background: var(--surface-hover); }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    button[disabled] { opacity: .4; cursor: default; }
    #record { font-weight: 600; border-color: var(--rec); color: var(--rec); }
    #record:hover:not([disabled]) { background: var(--rec-soft); }
    .row { display: flex; gap: 10px; align-items: center; }
    /* `.row`'s `display: flex` and the UA stylesheet's `[hidden] { display:
       none }` are equal specificity, and an author rule wins THAT tie
       regardless of source order — so a `.row` element toggled via `hidden`
       (the window/region source controls, STC-374) would stay visibly flexed.
       Restated explicitly, and !important because nothing here should ever
       need to out-rank "this element is hidden". */
    [hidden] { display: none !important; }
    #state { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-dim); }
    table { border-collapse: collapse; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    td { padding: 2px 14px 2px 0; }
    td:first-child { color: var(--text-dim); font-family: var(--font-sans); }
    #alert { padding: 10px 12px; border-radius: 7px; border: 1px solid var(--warn);
             background: var(--warn-soft); display: none; white-space: pre-wrap; }
    #alert.show { display: block; }
    h2 { font-size: 13px; font-weight: 600; margin: 4px 0 0; color: var(--text-dim); }
    .take { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
            padding: 7px 0; border-top: 1px solid var(--border); }
    .take .meta { color: var(--text-dim); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; }
    .take button { padding: 3px 10px; font-size: 12px; }
    .broken { color: var(--warn); font-size: 12px; padding: 6px 0; }

    /* ── the library grid (STC-294) ─────────────────────────────────────── */
    .libfilters { display: flex; gap: 6px; padding: 2px 0 10px; }
    .libfilters .chip { padding: 3px 12px; font-size: 12px; border-radius: 999px; color: var(--text-dim);
                         border: 1px solid transparent; }
    .libfilters .chip.on { color: var(--text); font-weight: 600;
                           border-color: var(--border-strong);
                           background: var(--surface-hover); }
    /* auto-fill, so a narrow window reflows rather than scrolling sideways. */
    .libgrid { display: grid; gap: 14px;
               grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .libtile { display: flex; flex-direction: column; gap: 7px;
               border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
               padding: 9px; min-width: 0; }
    /* A fixed aspect box, so the grid does not reflow as pictures land — 500
       tiles each nudging their neighbours is the jank the 60 fps criterion is
       about, and reserving the space costs nothing. */
    .libthumb { aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden;
                background: var(--surface-hover); display: flex;
                align-items: center; justify-content: center; }
    .libthumb img { max-width: 100%; max-height: 100%; display: block; }
    /* The checkerboard reads as "transparent" rather than "white", which for a
       window capture with real alpha is the difference between seeing the
       shape and thinking the shot has a white background. */
    .libthumb.empty { background-image:
        linear-gradient(45deg, var(--border) 25%, transparent 25%),
        linear-gradient(-45deg, var(--border) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--border) 75%),
        linear-gradient(-45deg, transparent 75%, var(--border) 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0; }
    .libbody { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .libbadge { align-self: flex-start; font-size: 10px; letter-spacing: .04em;
                text-transform: uppercase; padding: 1px 7px; border-radius: 999px;
                background: var(--surface-hover); color: var(--text-dim); }
    /* Coloured from the badge's own TEXT, so this stylesheet is the only place
       that knows there are two kinds — and the view module still does not. */
    .libbadge[data-badge="Still"] { background: var(--accent-soft); color: var(--accent); }
    .libtitle { font-size: 12px; font-weight: 600; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
    .libtile .meta { color: var(--text-dim); font-size: 11px; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
                     overflow: hidden; text-overflow: ellipsis; }
    .libactions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .libactions button { padding: 2px 9px; font-size: 11px; }
    .libactions button.delete { border-color: var(--rec); color: var(--rec); }
    .libempty { color: var(--text-faint); padding: 6px 0; }
    #empty { color: var(--text-faint); padding: 6px 0; }
    .stamp { color: var(--text-faint); font-size: 11px; margin-left: 6px; }
    .labelinput { font: inherit; padding: 2px 6px; border-radius: 5px;
                  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); width: 200px; }
    .take button.delete { border-color: var(--rec); color: var(--rec); }
    /* The take player's CSS (transport, timeline, trim, export, legibility,
       share, frame-grab) moved to app/renderer/editor.html with the rest of
       the player (STC-373) — the reskin (#135) restyled it here first, and
       this branch's own removal of #player and everything under it wins the
       conflict rather than reintroducing a restyled copy of a section that
       no longer exists in this window. */
    /* still capture preferences: the destination folder (STC-293) and the
       post-capture floating thumbnail (STC-296). The DECORATED still itself
       is composited and exported from the thumbnail's own window now — see
       app/renderer/thumbnail.html — so nothing here draws a preview. */
    .stillrow { display: flex; align-items: center; gap: 8px; margin-top: 6px;
                font-size: 12px; flex-wrap: wrap; }
    .stillrow label { display: flex; align-items: center; gap: 4px; }
    .stillrow button { padding: 3px 10px; font-size: 12px; }
    #stilldest { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; max-width: 260px; direction: rtl; }
    .shortcut { display: flex; align-items: baseline; gap: 10px; padding: 5px 0;
                border-top: 1px solid var(--border); }
    .shortcut .name { min-width: 150px; }
    .shortcut .keys { font: inherit; font-weight: 500; min-width: 88px; text-align: center; padding: 3px 10px;
                      font-size: 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .shortcut .keys.listening { border-color: var(--accent); color: var(--accent); }
    .shortcut .clear { padding: 3px 8px; font-size: 12px; }
    .shortcut .why { font-size: 12px; color: var(--warn); flex: 1; }
    .shortcut .why.ok { color: var(--text-dim); opacity: 1; }
    #shortcutfoot { display: flex; gap: 10px; align-items: baseline; padding-top: 8px; }
    #shortcutfoot button { padding: 3px 10px; font-size: 12px; }
    #shortcuthint { font-size: 12px; color: var(--text-faint); }

    /* ── capture scope (STC-370/STC-374) ─────────────────────────────────
       The scope picker (Screen/Window/Area) and the "source" control beside
       it — a display for Screen, a chosen window or area for the other two.
       Exactly one of #display-label / #window-source / #region-source is
       visible at a time; renderer.ts toggles `hidden` on the other two. */
    .sourcelabel { color: var(--text-dim); font-size: 12px; max-width: 220px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── the profile sheet (STC-374) ──────────────────────────────────────
       A panel INSIDE this window, not a fourth window — slides in from the
       right over the take grid rather than opening as its own surface. Holds
       what used to sit in the main flow: still-capture prefs and the
       shortcuts editor. `[hidden]` is not used here (it forces display:none,
       which cannot transition) — visibility is the `.open` class alone. */
    #profilesheet {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw);
      background: var(--surface); border-left: 1px solid var(--border);
      box-shadow: -12px 0 28px rgba(0, 0, 0, .16);
      transform: translateX(100%); transition: transform .18s ease;
      padding: 20px; box-sizing: border-box; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px; z-index: 10;
    }
    #profilesheet.open { transform: translateX(0); }
    #profilesheet h1 { font-size: 13px; }
    #profilesheet-head { justify-content: space-between; }
    #profileclose { padding: 3px 9px; font-size: 14px; line-height: 1; }

    /* ── the pill (STC-375) ──────────────────────────────────────────────
       Record collapses this real window to a 26px-tall pill (pill-window.ts);
       the renderer only learns about it via the `pill:state` IPC event
       (renderer.ts), which toggles this class on <body>. Without it the page
       goes on laying out the whole instrument at its normal size into a 26px
       viewport — clipped controls, not a pill.

       #pill is the whole pill: dot, live timer, hatched meter, and (this is
       the load-bearing part) the only thing that can stop a recording once
       collapsed — there is no hotkey for it (CAPTURE_ACTIONS in hotkeys.ts
       is stills only) — so it is a <button>, not a <div>, and shares
       #record's click handler (renderer.ts). Dark always (#0b0b0c/#f5f5f5,
       matching pill.ts's PILL_THEME — the one color pairing in this app that
       cannot be a shared token, since CSS cannot import a TS module): the
       ticket's own reasoning is that this surface floats over someone else's
       window for the length of a session, where light chrome has nothing
       reliable to sit against, so it does not follow STC-372's light/dark
       tokens the rest of the window does.

       #pill stays in the layout (`position: fixed`, off-screen) even while
       NOT collapsed, rather than `display: none` — a hidden element cannot
       be measured, and `renderer.ts`'s ResizeObserver needs its real content
       width to report to main (`pill:contentWidth`) so the window collapses
       to the pill's actual content-width rather than a guess. It becomes
       part of the visible page only under `.pill-collapsed`.

       Everything else in #record-row is hidden when collapsed — the still-
       capture button, the camera checkbox, the Profile button, the state
       readout — and every OTHER row in the body (profile sheet included, if
       it happened to be open: a sliver of a slide-over panel in a 26px
       window is its own kind of broken). */
    body.pill-collapsed { background: #0b0b0c; overflow: hidden; padding: 0; margin: 0; }
    body.pill-collapsed > *:not(#record-row) { display: none; }
    body.pill-collapsed #record-row > *:not(#pill) { display: none; }
    body.pill-collapsed #record-row { margin: 0; }

    #pill {
      position: fixed; top: -9999px; left: -9999px; visibility: hidden;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 10px; height: 26px; box-sizing: border-box;
      background: #0b0b0c; color: #f5f5f5; font: 12px/1 var(--font-mono);
      border: none; border-radius: 13px; cursor: pointer;
    }
    body.pill-collapsed #pill {
      position: static; top: auto; left: auto; visibility: visible;
      width: 100%; height: 100%;
    }
    #pill-dot {
      width: 8px; height: 8px; border-radius: 50%; flex: none;
      background: #ff3b30; animation: pill-live-pulse 1.4s ease-in-out infinite;
    }
    @keyframes pill-live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    #pill-timer { flex: none; font-variant-numeric: tabular-nums; }
    /* The level meter: hatched, NEVER a live reading — no audio capture
       exists anywhere in the helper (mic deferred since phase 1), and the
       ticket is explicit that drawing one "at a plausible level where it
       would read as live" would be a lie. A static diagonal-stripe fill is
       the one pattern that cannot be mistaken for a moving bar. */
    #pill-meter {
      width: 18px; height: 8px; border-radius: 2px; flex: none;
      background: repeating-linear-gradient(45deg, #3a3a3c 0 2px, transparent 2px 4px);
    }
  </style>
</head>
<body>
  <h1>stc recorder</h1>
  <div class="row" id="record-row">
    <button id="record">Record</button>
    <button id="pill" aria-label="Stop recording">
      <span id="pill-dot" aria-hidden="true"></span>
      <span id="pill-timer">00:00</span>
      <span id="pill-meter" aria-hidden="true"></span>
    </button>
    <button id="capturestill" title="Select a region or a window and capture one frame">Capture still</button>
    <label id="camera-label"><input type="checkbox" id="camera"> Camera</label>
    <button id="profile" title="Still-capture preferences and shortcuts">Profile</button>
    <span id="state">starting…</span>
  </div>
  <div class="row">
    <label>Scope <select id="scope">
      <option value="display">Screen</option>
      <option value="window">Window</option>
      <option value="region">Area</option>
    </select></label>
    <label id="display-label">Source <select id="display"><option value="">Automatic</option></select></label>
    <span id="window-source" class="row" hidden>
      <span id="window-source-label" class="sourcelabel">No window chosen</span>
      <button id="pickwindow">Choose window…</button>
      <button id="clearwindow" title="Forget the chosen window">Clear</button>
    </span>
    <span id="region-source" class="row" hidden>
      <span id="region-source-label" class="sourcelabel">No area chosen</span>
      <button id="pickregion">Choose area…</button>
      <button id="clearregion" title="Forget the chosen area">Clear</button>
    </span>
  </div>
  <div id="stillstatus" hidden></div>
  <div id="alert"></div>

  <table>
    <tbody>
      <tr><td>helper pid</td><td id="pid">—</td></tr>
      <tr><td>helper</td><td id="alive">—</td></tr>
      <tr><td>camera</td><td id="camera-state">—</td></tr>
      <tr><td>frames</td><td id="frames">—</td></tr>
      <tr><td>dropped</td><td id="dropped">—</td></tr>
      <tr><td>events</td><td id="events">—</td></tr>
      <tr><td>cursor shapes</td><td id="cursorEvents">—</td></tr>
      <tr><td>elapsed</td><td id="elapsed">—</td></tr>
    </tbody>
  </table>

  <h2 id="lib-heading">Recordings</h2>
  <div id="takes"></div>

  <!--
    The profile sheet (STC-374): still-capture prefs and the shortcuts editor,
    moved out of the main flow behind the Profile button. Nothing in here
    changed behaviour — only where it lives.
  -->
  <aside id="profilesheet">
    <div class="row" id="profilesheet-head">
      <h1>Profile</h1>
      <button id="profileclose" aria-label="Close">×</button>
    </div>

    <h2>Still capture</h2>
    <!--
      The destination folder (STC-293) and the post-capture floating
      thumbnail's preferences (STC-296). The decorated still itself — style,
      redact, copy, save — is the thumbnail's own compact panel now
      (app/renderer/thumbnail.html, "the whole still UI in v1"); nothing here
      previews or exports a shot.
    -->
    <div class="stillrow">
      <span>Saving to</span>
      <span id="stilldest">beside the shot</span>
      <button id="stillchoosedest">Change…</button>
      <button id="stillcleardest">Beside the shot</button>
    </div>
    <div class="stillrow">
      <label>Panel corner <select id="thumbcorner">
        <option value="bottom-right">Bottom right</option>
        <option value="bottom-left">Bottom left</option>
        <option value="top-right">Top right</option>
        <option value="top-left">Top left</option>
      </select></label>
      <label title="Never less than 3 seconds">Closes after
        <input id="thumbtimeout" type="number" min="3" max="60" step="1" style="width:3.5em">s</label>
      <label>then <select id="thumbsettle">
        <option value="save">Save</option>
        <option value="copy">Copy</option>
      </select></label>
      <label title="Skip the panel entirely and copy every capture straight to the clipboard">
        <input type="checkbox" id="thumbskip"> Skip it — straight to clipboard</label>
    </div>

    <h2>Capture shortcuts</h2>
    <div id="shortcuts"></div>
    <div id="shortcutfoot">
      <button id="resetshortcuts">Restore defaults</button>
      <label id="shutter-label" title="Play the system camera-shutter sound when a still is captured">
        <input type="checkbox" id="shuttersound" checked> Shutter sound</label>
      <span id="shortcuthint">Work with the app in the background. Click a shortcut, then press the keys.</span>
    </div>
  </aside>
  <script src="../dist/renderer.js"></script>
</body>
</html>
