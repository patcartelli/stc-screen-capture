<!doctype html>
<html data-surface="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>countdown</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /*
      STC-391. The window is transparent and borderless — everything that reads
      as "a panel" is this card's own background and shadow, the same
      arrangement `thumbnail.html` uses.
    */
    /* Dark always — it sits on the user's screen (STC-504, tokens.css). */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font: var(--type-body-weight) var(--type-body)/var(--type-body-lh) var(--font-sans);
      -webkit-user-select: none; user-select: none;
    }
    #card {
      position: absolute; inset: 8px;
      border-radius: var(--radius-card);
      background: var(--card-bg);
      color: var(--text);
      box-shadow: var(--shadow-card);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: var(--space-2);
    }
    #dial { position: relative; width: 72px; height: 72px; }
    #ring { position: absolute; inset: 0; }
    /*
      Rotated so the sweep starts at twelve o'clock rather than at three, which
      is where an SVG circle's dash offset would otherwise begin.
    */
    #ring { transform: rotate(-90deg); }
    #track { fill: none; stroke: var(--overlay-fill-hover); stroke-width: 4; }
    #sweep {
      fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round;
      transition: stroke-dashoffset var(--dur-quick) linear;
    }
    #count {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--type-count); font-weight: var(--type-count-weight); line-height: var(--type-count-lh);
      font-variant-numeric: tabular-nums;
    }
    #caption { font-size: var(--type-body); color: var(--text-dim); }
    #actions { display: flex; gap: var(--space-3); margin-top: var(--space-1); }
    button {
      font: inherit; font-size: var(--type-body);
      padding: 5px 14px; border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--overlay-fill-faint); color: inherit;
      cursor: pointer;
    }
    button:hover { background: var(--overlay-fill); }
    #skip { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    kbd {
      font: inherit; font-size: var(--type-label); color: var(--text-dim); margin-left: var(--space-1);
    }
    /*
      Reduced motion (STC-391 rule 5): the ring goes, the COUNT goes on
      counting. Driven off the body attribute `countdown-renderer.ts` sets from
      `countdownView`, so the decision has one owner and the page is not a
      second place it is made.

      Hidden from CSS rather than with the `hidden` property, and that is a
      finding rather than a style choice: `#ring` is an <svg>, and `hidden`
      lives on HTMLElement — SVGElement takes `dataset`/`nonce`/`autofocus`/
      `tabIndex` from HTMLOrSVGElement but not `hidden`, so `ring.hidden = true`
      sets a JS expando and reflects no attribute at all. It looked like it
      worked and hid nothing; the E2E caught it.
    */
    body[data-animate="false"] #ring { display: none; }
    /* Belt for a viewer whose setting changes between one frame and the next,
       before a state message can arrive and re-run the decision. */
    @media (prefers-reduced-motion: reduce) {
      #sweep { transition: none; }
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="dial">
      <svg id="ring" viewBox="0 0 72 72" aria-hidden="true">
        <circle id="track" cx="36" cy="36" r="26"></circle>
        <circle id="sweep" cx="36" cy="36" r="26"></circle>
      </svg>
      <div id="count" role="status" aria-live="polite">—</div>
    </div>
    <div id="caption"></div>
    <div id="actions">
      <button id="cancel" type="button">Cancel<kbd>esc</kbd></button>
      <button id="skip" type="button">Skip<kbd>&#8629;</kbd></button>
    </div>
  </div>
  <script src="../dist/countdown-renderer.js"></script>
</body>
</html>
