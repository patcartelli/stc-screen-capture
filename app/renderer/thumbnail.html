<!doctype html>
<html data-surface="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <title>shot</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Dark always — over someone else's desktop corner (STC-504, tokens.css). */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font: var(--type-body-weight) var(--type-body)/var(--type-body-lh) var(--font-sans);
    }
    /*
      The window itself is transparent and borderless (STC-296) — everything
      that reads as "a panel" is this card's own background and shadow, so it
      can sit in a screen corner with rounded corners and a soft edge rather
      than a rectangular OS window.
    */
    #card {
      position: absolute; inset: 8px;
      border-radius: var(--radius-card);
      background: var(--card-bg);
      color: var(--text);
      box-shadow: var(--shadow-card);
      display: flex; flex-direction: column;
      overflow: hidden;
      opacity: 0; transform: scale(0.92);
      transition: opacity var(--dur-base) ease-out, transform var(--dur-base) ease-out;
      cursor: default;
    }
    #card.in { opacity: 1; transform: scale(1); }
    /*
      While a swipe is in progress the card is following the pointer directly,
      so the 160 ms transition above has to be off: with it on, the panel lags
      the finger by a sixth of a second and the gesture feels broken. It goes
      back on for the release, which is what makes both outcomes — springing
      back to the corner, and flying off the edge — animate rather than jump.
    */
    #card.dragging { transition: none; }
    /*
      Close without deciding (STC-412) — a small ghost circle in the corner,
      OUTSIDE `#actions`'s four buttons and visually distinct from `#trash`'s
      inline "✕": this is never gated by `actionsFor` and is always present.
    */
    #dismiss {
      position: absolute; top: 6px; right: 6px; z-index: 1;
      width: 20px; height: 20px; padding: 0; line-height: 1;
      border: none; border-radius: var(--radius-pill);
      background: var(--overlay-fill); color: var(--text);
      font-size: var(--type-title); cursor: pointer;
    }
    #dismiss:hover { background: var(--overlay-fill-hover); }
    #thumbwrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: var(--space-4) var(--space-4) 0;
      min-height: 0;
    }
    #thumbcanvas { max-width: 100%; max-height: 100%; display: block; border-radius: var(--radius-sm); }
    /* A recording has no picture in v1 (D2) — see thumbnail.html's own markup
       comment below. Sized and centered the same as #thumbwrap so the card's
       layout does not jump between the two takecard kinds. */
    #takecard { flex: 1; display: flex; flex-direction: column;
                align-items: center; justify-content: center; text-align: center; }
    #takemeta { opacity: 0.7; margin-top: 2px; }
    #copyprogress { width: 100%; height: var(--space-1); margin-top: var(--space-2); accent-color: var(--accent); }
    #copyprogress[hidden] { display: none; }
    #controls { padding: var(--space-3) var(--space-4) var(--space-4); }
    .row { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); flex-wrap: wrap; }
    select, button {
      font: inherit; color: inherit; background: var(--overlay-fill);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: var(--space-1) var(--space-3); cursor: pointer;
    }
    button:hover { background: var(--overlay-fill-hover); }
    button:disabled { opacity: 0.4; cursor: default; }
    button:disabled:hover { background: var(--overlay-fill); }
    button[hidden] { display: none; }
    /* An author `display: flex` outranks the UA's `[hidden] { display: none }`,
       so without this the renderer's `hidden = true` on one of these two did
       nothing: a recording's card kept an empty picture area above it, and a
       shot's panel drew an empty card (STC-487, caught by recording-panel.e2e). */
    #thumbwrap[hidden], #takecard[hidden] { display: none; }
    #trash { margin-left: auto; padding: var(--space-1) 9px; }
    /*
      Controls show on hover (STC-426 revision) — the card at rest is just
      the picture; the actions fade in once the pointer is actually over it.
      Applied to each button individually rather than to `#controls` as a
      whole, because CSS opacity COMPOUNDS down the tree: a child's own
      `opacity: 1` cannot undo a parent already at 0, so `#overflow` (the
      waiting-captures badge) and `#status` (action feedback) are left out of
      this rule on purpose — they are status, not controls, and their whole
      point is to be seen without first having to hover.

      Deliberately OPACITY ONLY — no `pointer-events: none` at rest. A first
      version added it, on the reasoning that an invisible button should not
      be clickable either, and it broke nearly every existing e2e test in
      this file: Playwright's own actionability check excludes a
      `pointer-events: none` element from hit-testing BEFORE it ever gets to
      hover it, so `panel.click("#save")` retried for 30 s finding
      `#controls` "intercepting" and never reached the button at all — the
      same chicken-and-egg every `:hover`-gated interactive target has for
      automated input, one layer past `still-overlay.e2e.test.ts`'s own
      real-vs-synthetic-input lesson. A sighted person will not click
      somewhere they cannot see a button, so leaving pointer-events at its
      default costs nothing real and keeps every existing click-driven test
      working unmodified.
    */
    #actions button[data-action] { opacity: 0; transition: opacity var(--dur-quick) ease-out; }
    #card:hover #actions button[data-action] { opacity: 1; }
    /* A disabled button (an action in flight, STC-392 review M6) stays
       dimmed even while hovering — :disabled here outweighs the rule above
       on specificity alone, not on source order. */
    #card:hover #actions button[data-action]:disabled { opacity: 0.4; }
    /*
      The overflow badge (Task 5b / STC-392 D7) — how many captures the
      MAX_STACKED cap is hiding behind this one, reachable through the SAME
      panel component rather than a second list UI. No `data-action`: it is
      not one of `panel-actions.ts`'s four take actions, and
      `thumbnail-renderer.ts` scopes its action-row queries to
      `[data-action]` specifically so this button is left alone by both.
    */
    #overflow { font-weight: var(--type-body-strong-weight); }
    #status { opacity: 0.75; margin-top: 4px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="card">
    <button id="dismiss" title="Close without deciding" aria-label="Close">×</button>
    <div id="thumbwrap"><canvas id="thumbcanvas"></canvas></div>
    <!-- A recording has no picture in v1 (D2); this stands in for the canvas,
         using the same vocabulary the library already has for a take with no
         thumbnail (`library-items.ts`'s `source: "none"`). -->
    <div id="takecard" hidden>
      <div id="takemeta"></div>
      <!-- STC-488: a recording's Copy renders first. Hidden unless one is running. -->
      <progress id="copyprogress" max="1000" value="0" hidden></progress>
    </div>
    <div id="controls">
      <div class="row" id="actions">
        <button id="copy" data-action="copy">Copy</button>
        <button id="save" data-action="save">Save</button>
        <button id="edit" data-action="edit">Edit</button>
        <button id="overflow" title="Show the waiting captures" hidden>+0</button>
        <button id="trash" data-action="trash" title="Delete this take">✕</button>
      </div>
      <div id="status"></div>
    </div>
  </div>
  <script src="../dist/thumbnail-renderer.js"></script>
</body>
</html>
