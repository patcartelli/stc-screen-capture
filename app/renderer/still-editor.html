<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Redact</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Fonts, type ramp and light/dark color tokens live in tokens.css now
       (STC-443) — this window used to force `color-scheme: dark` and
       hardcode every color itself; it now follows the OS preference like
       the other two windows, through the shared tokens alone. */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text); overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    /* The canvas gets the whole window minus the toolbar — resized on every
       window resize (still-editor-renderer.ts), unlike the fixed-size panel
       this replaced for redaction. */
    #stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      min-height: 0; padding: 16px;
    }
    #stagecanvas { max-width: 100%; max-height: 100%; display: block; cursor: crosshair; }

    /* ── the toolbar (STC-443): hairline icon buttons, same language the
       video editor's own transport will use. Undo/Save/Done, in that
       order — Undo and Save are equal-weight utilities, Done is the one
       action that carries primary weight and closes the window. */
    #toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-top: 1px solid var(--border);
      background: var(--surface);
    }
    #hint { flex: 1; font-size: var(--type-body); color: var(--text-dim); }

    .iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; padding: 0; flex: none;
      border-radius: 7px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--text-dim); cursor: pointer;
    }
    .iconbtn svg {
      width: 16px; height: 16px; stroke: currentColor; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .iconbtn:hover:not([disabled]) { background: var(--surface-hover); color: var(--text); }
    .iconbtn:active:not([disabled]) { transform: scale(.93); }
    .iconbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .iconbtn[disabled] { opacity: .4; cursor: default; }
    /* Reduced motion (STC-506): the press shows as a fill, not a shrink. */
    @media (prefers-reduced-motion: reduce) {
      .iconbtn:active:not([disabled]) { transform: none; background: var(--border); }
    }
    /* ── the background picker (STC-599): a swatch grid, a radio group. Only
       window shots with alpha get it (still-editor-renderer.ts unhides it). */
    #looks {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
      padding: 10px 14px; border-top: 1px solid var(--border); background: var(--surface);
    }
    #looks[hidden] { display: none; }
    #looks .label {
      font-size: var(--type-label); font-weight: var(--type-label-weight);
      letter-spacing: var(--type-label-tracking); text-transform: uppercase; color: var(--text-dim);
      margin-right: 4px;
    }
    #lookgrid { display: flex; flex-wrap: wrap; gap: 8px; }
    .look {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 3px; border: 1px solid transparent; border-radius: 8px;
      background: none; color: var(--text-dim); cursor: pointer;
      font: inherit; font-size: var(--type-meta);
    }
    .look .chip {
      width: 44px; height: 30px; border-radius: 5px; box-sizing: border-box;
      border: 1px solid var(--border-strong); position: relative; overflow: hidden;
    }
    /* The two no-background options show a window on the page's own colour. */
    .look[data-look="window-only"] .chip,
    .look[data-look="window-shadow"] .chip { background: var(--surface-hover); }
    .look[data-look="window-only"] .chip::after,
    .look[data-look="window-shadow"] .chip::after {
      content: ""; position: absolute; inset: 7px 9px; border-radius: 2px;
      background: var(--surface); border: 1px solid var(--border-strong);
    }
    .look[data-look="window-shadow"] .chip::after { box-shadow: 0 3px 5px rgba(0,0,0,.35); }
    .look:hover:not([aria-disabled="true"]) { background: var(--surface-hover); color: var(--text); }
    .look:active:not([aria-disabled="true"]) { transform: scale(.96); }
    .look:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .look[aria-checked="true"] { border-color: var(--accent); color: var(--text); }
    .look[aria-disabled="true"] { opacity: .4; cursor: default; }
    @media (prefers-reduced-motion: reduce) {
      .look:active:not([aria-disabled="true"]) { transform: none; background: var(--border); }
    }
    #customcolors { display: flex; align-items: center; gap: 6px; }
    #customcolors[hidden] { display: none; }
    #customcolors input {
      width: 72px; padding: 4px 6px; border-radius: 6px; box-sizing: border-box;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      font: inherit; font-size: var(--type-meta); font-family: var(--mono, ui-monospace, monospace);
    }
    #customcolors input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    #customcolors input[aria-invalid="true"] { border-color: var(--warn, #c0392b); }

    /* Done keeps its primary weight (the ticket's own words) — the shared
       accent token now, not a hardcoded #3b6fe0 this window used to own. */
    #done { border-color: var(--accent); color: var(--accent); }
    #done:hover:not([disabled]) { background: var(--accent-soft); }
  </style>
</head>
<body>
  <div id="stage"><canvas id="stagecanvas"></canvas></div>
  <div id="looks" hidden>
    <span class="label" id="lookslabel">Background</span>
    <div id="lookgrid" role="radiogroup" aria-labelledby="lookslabel"></div>
    <div id="customcolors" hidden>
      <input id="custom-a" type="text" spellcheck="false" autocomplete="off" maxlength="7" aria-label="Custom colour, #rrggbb" placeholder="#3b4252">
      <input id="custom-b" type="text" spellcheck="false" autocomplete="off" maxlength="7" aria-label="Second colour, optional, #rrggbb" placeholder="optional">
    </div>
  </div>
  <div id="toolbar">
    <span id="hint">Drag a box over anything private.</span>
    <button id="undo" class="iconbtn" aria-label="Undo" title="Undo the last box (⌘Z)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
    </button>
    <button id="save" class="iconbtn" aria-label="Save" title="Save the finished image to your save folder (⌘S)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    </button>
    <button id="done" class="iconbtn" aria-label="Done" title="Done (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </button>
  </div>
  <script src="../dist/still-editor-renderer.js"></script>
</body>
</html>
