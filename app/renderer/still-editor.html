<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
  <title>Redact</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1e1e20; color: #f2f2f2; overflow: hidden;
      font: 13px/1.4 -apple-system, system-ui, sans-serif;
    }
    body { display: flex; flex-direction: column; }
    /* The canvas gets the whole window minus the toolbar — resized on every
       window resize (still-editor-renderer.ts), unlike the fixed-size panel
       this replaced for redaction. */
    #stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      min-height: 0; padding: 16px;
    }
    #stagecanvas { max-width: 100%; max-height: 100%; display: block; cursor: crosshair; }
    #toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    #hint { opacity: 0.7; flex: 1; }
    button {
      font: inherit; color: inherit; background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px;
      padding: 6px 14px; cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.2); }
    button:disabled { opacity: 0.4; cursor: default; }
    #done { background: #3b6fe0; border-color: #3b6fe0; }
    #done:hover { background: #4a7bea; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="stagecanvas"></canvas></div>
  <div id="toolbar">
    <span id="hint">Drag a box over anything private.</span>
    <button id="undo" title="Remove the last box">Undo</button>
    <button id="done">Done</button>
  </div>
  <script src="../dist/still-editor-renderer.js"></script>
</body>
</html>
